name: CI

# Trigger the workflow on push or pull request to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Allow only one concurrent deployment per branch, skipping intermediate runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate, Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js with caching for faster dependency installation
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Matches your recommended runtime
          cache: 'npm'       # Automatically caches npm dependencies

      # 3. Install dependencies cleanly (npm ci is faster and more strict than npm install)
      - name: Install dependencies
        run: npm ci

      # 4. Type checking (Ensures no TypeScript errors before building)
      - name: Type Check
        run: npm run lint

      # 5. Build the project (Frontend via Vite, Backend via esbuild)
      - name: Build Project
        run: npm run build

      # 6. Run tests (Vitest)
      # We run tests after build to ensure we only test code that successfully compiles
      - name: Run Tests
        run: npm run test
